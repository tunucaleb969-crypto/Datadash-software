apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace 'com.kwame.datadash'
    compileSdk 34

    defaultConfig {
        applicationId "com.kwame.datadash"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "GEMINI_API_KEY", "\"${project.findProperty('GEMINI_API_KEY') ?: ''}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

// Room 2.6.1's bundled kapt annotation processor ships an older
// kotlinx-metadata-jvm reader that only understands metadata format
// up to 2.0.0. Our Kotlin 2.1.20 toolchain produces 2.1.0 metadata,
// which crashes kapt with "Provided Metadata instance has version
// 2.1.0, while maximum supported version is 2.0.0". Forcing this one
// transitive library to a newer release fixes it without touching
// anything else.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlinx:kotlinx-metadata-jvm:2.1.0'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'net.zetetic:sqlcipher-android:4.17.0'
    implementation 'androidx.sqlite:sqlite:2.7.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
